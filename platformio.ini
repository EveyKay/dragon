; PlatformIO project config for the dragon's ESP32.
; Build:              pio run
; Upload over USB:    pio run -e esp32dev -t upload
; Upload over WiFi:   pio run -e esp32dev_ota -t upload
;                     (needs platformio_local.ini -- copy
;                     platformio_local.ini.example and fill in the
;                     dragon's IP/hostname and OTA password)
; Serial monitor:     pio device monitor
;
; Migrated from an Arduino Uno -- that version (and its platformio.ini)
; is still available in git history (commit fe84b30 and earlier) if
; ever needed again.

[platformio]
src_dir = dragon_servos_15
extra_configs = platformio_local.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2
    dfrobot/DFRobotDFPlayerMini @ ^1.0.5

[env:esp32dev]
upload_port = COM8
monitor_port = COM8

[env:esp32dev_ota]
upload_protocol = espota
; upload_port (the dragon's IP or dragon.local) and upload_flags (the
; --auth password, matching OTA_PASSWORD in wifi_credentials.h) come
; from platformio_local.ini, which is gitignored.
