; PlatformIO project config for the dragon's Arduino Uno.
; Build from the command line with: pio run
; Upload with:                      pio run -t upload
; Serial monitor with:              pio device monitor

[platformio]
src_dir = dragon_servos_15

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo @ ^1.2.2
    dfrobot/DFRobotDFPlayerMini @ ^1.0.5
