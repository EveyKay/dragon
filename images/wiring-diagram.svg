<rect x="592" y="470" width="40" height="36" rx="5" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="512" y="493" text-anchor="middle" font-size="11" fill="#1F2933">idle</text>
<text x="562" y="493" text-anchor="middle" font-size="11" fill="#1F2933">talk</text>
<text x="612" y="493" text-anchor="middle" font-size="11" fill="#1F2933">home</text>
<line x1="512" y1="506" x2="512" y2="540" stroke="#1F2933" stroke-width="2.5"/>
