<line x1="612" y1="506" x2="612" y2="540" stroke="#1F2933" stroke-width="2.5"/>
<line x1="512" y1="540" x2="660" y2="540" stroke="#1F2933" stroke-width="2.5"/>
<line x1="660" y1="540" x2="660" y2="410" stroke="#1F2933" stroke-width="2.5"/>
<text x="586" y="562" text-anchor="middle" font-size="11" fill="#1F2933">Buttons: pin to GND when pressed</text>
<text x="586" y="577" text-anchor="middle" font-size="11" fill="#1F2933">(internal pull-ups, no resistors)</text>

