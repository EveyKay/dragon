<text x="96" y="616" font-size="11" fill="#1F2933">power</text>
<line x1="160" y1="612" x2="190" y2="612" stroke="#1F2933" stroke-width="3"/>
<text x="196" y="616" font-size="11" fill="#1F2933">ground</text>
<line x1="270" y1="612" x2="300" y2="612" stroke="#F77F00" stroke-width="3"/>
<text x="306" y="616" font-size="11" fill="#1F2933">3.3V</text>
<line x1="360" y1="612" x2="390" y2="612" stroke="#1D6FD6" stroke-width="3"/>
<text x="396" y="616" font-size="11" fill="#1F2933">I2C</text>
<line x1="450" y1="612" x2="480" y2="612" stroke="#2A9D4A" stroke-width="3"/>
