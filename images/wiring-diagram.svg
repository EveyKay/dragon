<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" font-family="Helvetica, Arial, sans-serif">
<title>Terry wiring diagram</title>
<desc>Battery to LM2596 converter to a shared power rail feeding the ESP32 VIN pin, the PCA9685 servo driver V+ pin and the DFPlayer Mini. The ESP32 talks to the PCA9685 over I2C (GPIO21 SDA, GPIO22 SCL), to the DFPlayer over UART (GPIO32 RX, GPIO33 TX), and reads three mode buttons on GPIO25, 26 and 27.</desc>
<rect width="960" height="650" fill="#FFFFFF"/>

<rect x="120" y="30" width="120" height="60" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="176" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2933">Battery pack</text>
<text x="234" y="54" text-anchor="end" font-size="11" fill="#1F2933">+</text>
<text x="234" y="74" text-anchor="end" font-size="11" fill="#1F2933">-</text>
<line x1="240" y1="50" x2="310" y2="50" stroke="#D62828" stroke-width="2.5"/>
<line x1="240" y1="70" x2="310" y2="70" stroke="#1F2933" stroke-width="2.5"/>

<rect x="310" y="30" width="170" height="60" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="395" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2933">LM2596 converter</text>
<text x="340" y="84" text-anchor="middle" font-size="11" fill="#1F2933">OUT-</text>
<text x="450" y="84" text-anchor="middle" font-size="11" fill="#1F2933">OUT+</text>

<line x1="180" y1="150" x2="920" y2="150" stroke="#D62828" stroke-width="4"/>
<line x1="200" y1="176" x2="920" y2="176" stroke="#1F2933" stroke-width="4"/>
<text x="600" y="140" font-size="12" fill="#9B1C1C">Power rail (from LM2596)</text>
<text x="600" y="196" font-size="12" fill="#1F2933">GND (common)</text>

<line x1="450" y1="90" x2="450" y2="150" stroke="#D62828" stroke-width="2.5"/>
<line x1="340" y1="90" x2="340" y2="176" stroke="#1F2933" stroke-width="2.5"/>

<rect x="140" y="240" width="190" height="170" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="235" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2933">PCA9685 servo driver</text>
<text x="180" y="258" text-anchor="middle" font-size="11" fill="#1F2933">V+</text>
<text x="220" y="258" text-anchor="middle" font-size="11" fill="#1F2933">GND</text>
<text x="322" y="274" text-anchor="end" font-size="11" fill="#1F2933">VCC</text>
<text x="322" y="304" text-anchor="end" font-size="11" fill="#1F2933">SDA</text>
<text x="322" y="334" text-anchor="end" font-size="11" fill="#1F2933">SCL</text>
<line x1="180" y1="240" x2="180" y2="150" stroke="#D62828" stroke-width="2.5"/>
<line x1="220" y1="240" x2="220" y2="176" stroke="#1F2933" stroke-width="2.5"/>

<line x1="180" y1="208" x2="194" y2="208" stroke="#D62828" stroke-width="2.5"/>
<line x1="206" y1="208" x2="220" y2="208" stroke="#1F2933" stroke-width="2.5"/>
<line x1="194" y1="198" x2="194" y2="218" stroke="#1F2933" stroke-width="2.5"/>
<line x1="206" y1="198" x2="206" y2="218" stroke="#1F2933" stroke-width="2.5"/>
<text x="172" y="212" text-anchor="end" font-size="11" fill="#1F2933">2200-4700uF cap</text>

<rect x="480" y="240" width="200" height="170" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="580" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2933">ESP32 dev board</text>
<text x="520" y="258" text-anchor="middle" font-size="11" fill="#1F2933">VIN</text>
<text x="560" y="258" text-anchor="middle" font-size="11" fill="#1F2933">GND</text>
<text x="488" y="274" font-size="11" fill="#1F2933">3V3</text>
<text x="488" y="304" font-size="11" fill="#1F2933">GPIO21</text>
<text x="488" y="334" font-size="11" fill="#1F2933">GPIO22</text>
<text x="672" y="304" text-anchor="end" font-size="11" fill="#1F2933">GPIO32 (RX)</text>
<text x="672" y="334" text-anchor="end" font-size="11" fill="#1F2933">GPIO33 (TX)</text>
<text x="512" y="402" text-anchor="middle" font-size="11" fill="#1F2933">GPIO25</text>
<text x="562" y="402" text-anchor="middle" font-size="11" fill="#1F2933">GPIO26</text>
<text x="612" y="402" text-anchor="middle" font-size="11" fill="#1F2933">GPIO27</text>
<text x="660" y="402" text-anchor="middle" font-size="11" fill="#1F2933">GND</text>
<line x1="520" y1="240" x2="520" y2="150" stroke="#D62828" stroke-width="2.5"/>
<line x1="560" y1="240" x2="560" y2="176" stroke="#1F2933" stroke-width="2.5"/>

<line x1="330" y1="270" x2="480" y2="270" stroke="#F77F00" stroke-width="2.5"/>
<line x1="330" y1="300" x2="480" y2="300" stroke="#1D6FD6" stroke-width="2.5"/>
<line x1="330" y1="330" x2="480" y2="330" stroke="#1D6FD6" stroke-width="2.5"/>
<text x="405" y="264" text-anchor="middle" font-size="11" fill="#B45F00">3.3V</text>
<text x="405" y="294" text-anchor="middle" font-size="11" fill="#1D6FD6">SDA</text>
<text x="405" y="324" text-anchor="middle" font-size="11" fill="#1D6FD6">SCL</text>

<rect x="740" y="240" width="180" height="170" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="830" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2933">DFPlayer Mini</text>
<text x="830" y="376" text-anchor="middle" font-size="11" fill="#1F2933">(microSD inside)</text>
<text x="748" y="304" font-size="11" fill="#1F2933">TX</text>
<text x="748" y="334" font-size="11" fill="#1F2933">RX</text>
<text x="780" y="258" text-anchor="middle" font-size="11" fill="#1F2933">VCC</text>
<text x="820" y="258" text-anchor="middle" font-size="11" fill="#1F2933">GND</text>
<text x="780" y="402" text-anchor="middle" font-size="11" fill="#1F2933">SPK1</text>
<text x="820" y="402" text-anchor="middle" font-size="11" fill="#1F2933">SPK2</text>
<line x1="780" y1="240" x2="780" y2="150" stroke="#D62828" stroke-width="2.5"/>
<line x1="820" y1="240" x2="820" y2="176" stroke="#1F2933" stroke-width="2.5"/>
<line x1="680" y1="300" x2="740" y2="300" stroke="#2A9D4A" stroke-width="2.5"/>
<line x1="680" y1="330" x2="740" y2="330" stroke="#2A9D4A" stroke-width="2.5"/>

<line x1="780" y1="410" x2="780" y2="470" stroke="#6B7280" stroke-width="2.5"/>
<line x1="820" y1="410" x2="820" y2="470" stroke="#6B7280" stroke-width="2.5"/>
<rect x="760" y="470" width="80" height="50" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="800" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2933">Speaker</text>
<text x="800" y="536" text-anchor="middle" font-size="11" fill="#1F2933">4 ohm 3W</text>

<line x1="235" y1="410" x2="235" y2="470" stroke="#6B7280" stroke-width="5"/>
<text x="247" y="445" font-size="11" fill="#1F2933">servo PWM</text>
<rect x="140" y="470" width="190" height="100" rx="6" fill="#F4F5F7" stroke="#5B6472" stroke-width="1.5"/>
<text x="235" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2933">8 servos (channels 2-9)</text>
<text x="152" y="510" font-size="11" fill="#1F2933">2 eyeLeft</text>
<text x="152" y="526" font-size="11" fill="#1F2933">3 eyeRight</text>
<text x="152" y="542" font-size="11" fill="#1F2933">4 eyelidLeft</text>
<text x="152" y="558" font-size="11" fill="#1F2933">5 eyelidRight</text>
<text x="245" y="510" font-size="11" fill="#1F2933">6 jaw</text>
<text x="245" y="526" font-size="11" fill="#1F2933">7 neck1</text>
<text x="245" y="542" font-size="11" fill="#1F2933">8 neck2</text>
<text x="245" y="558" font-size="11" fill="#1F2933">9 neck3</text>

<line x1="512" y1="410" x2="512" y2="470" stroke="#0B9AA8" stroke-width="2.5"/>
<line x1="562" y1="410" x2="562" y2="470" stroke="#0B9AA8" stroke-width="2.5"/>
